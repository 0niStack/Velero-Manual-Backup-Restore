apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: demo-app
data:
  APP_ENV: "backup-lab"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-data
  namespace: demo-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      initContainers:
        - name: seed
          image: busybox:1.36
          command: ["sh","-c","[ -f /data/index.html ] || echo \"Velero backup test - created $(date)\" > /data/index.html"]
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          envFrom:
            - configMapRef: { name: web-config }
          volumeMounts:
            - { name: data, mountPath: /usr/share/nginx/html }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: web-data }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo-app
spec:
  selector: { app: web }
  ports:
    - { port: 80, targetPort: 80 }
