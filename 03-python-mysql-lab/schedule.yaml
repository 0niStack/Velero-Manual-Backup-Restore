# Velero schedule for Python-MySQL-Lab: manifests, Secrets, NetworkPolicies, quotas
# (MySQL data is protected by the SQL dump, see 01-dump.sh, because the PVC is hostPath)
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pymysql-daily
  namespace: velero
spec:
  schedule: "0 2 * * *"
  useOwnerReferencesInBackup: false
  template:
    includedNamespaces:
      - myapp
      - mydb
    snapshotVolumes: false
    ttl: 720h0m0s
    storageLocation: default
